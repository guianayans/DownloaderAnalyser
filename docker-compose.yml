services:
  downloader:
    container_name: downloader
    build:
      context: /pendriver/downloader
      dockerfile: Dockerfile
    image: downloader-local:latest
    pull_policy: build
    working_dir: /app
    volumes:
      - /pendriver/downloader:/app
      - downloader_node_modules:/app/node_modules
      - /:/host
    environment:
      NODE_ENV: production
      PORT: "4020"
      DOWNLOADER_ROOT: "/host"
      DOWNLOADER_ROOT_LABEL: "/"
      DOWNLOADER_HIST_DIR: "/host/pendriver/downloader_hist"
      DOWNLOADER_PASSWORD: ${DOWNLOADER_PASSWORD}
      DOWNLOADER_SESSION_SECRET: ${DOWNLOADER_SESSION_SECRET}
      HF_XET_HIGH_PERFORMANCE: ${HF_XET_HIGH_PERFORMANCE:-${HF_HUB_ENABLE_HF_TRANSFER:-1}}
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_HOST_ROOT: ${OLLAMA_HOST_ROOT:-/}
      OLLAMA_CONTAINER_ROOT: ${OLLAMA_CONTAINER_ROOT:-/root/.ollama}
      OLLAMA_GGUF_STAGING_DIR: ${OLLAMA_GGUF_STAGING_DIR:-gguf-import}
      AI_GGUF_DIRS: ${AI_GGUF_DIRS:-pendriver/llamacpp/models}
      OLLAMA_MODELS_DIR: ${OLLAMA_MODELS_DIR:-}
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL:-https://openwebui.gvtserver.online}
      LLAMAWEB_URL: ${LLAMAWEB_URL:-http://host.docker.internal:8090}
      LLAMAWEB_PUBLIC_URL: ${LLAMAWEB_PUBLIC_URL:-https://llamacpp.gvtserver.online}
      OLLAMA_PUBLIC_URL: ${OLLAMA_PUBLIC_URL:-http://yanserver.ddns.net:11434}
      LLAMAWEB_URL: ${LLAMAWEB_URL:-http://llamacpp:8080}
      LLAMAWEB_PUBLIC_URL: ${LLAMAWEB_PUBLIC_URL:-https://llamacpp.gvtserver.online}
      GPU_TERMINAL_MODE: ${GPU_TERMINAL_MODE:-container}
      GPU_TERMINAL_CMD: ${GPU_TERMINAL_CMD:-nvtop}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    restart: unless-stopped
    # Requer nvidia-container-toolkit no host. Se Coolify não suportar gpus:, use só devices: abaixo.
    gpus: all
    # SYS_ADMIN só se GPU_TERMINAL_MODE=host (nsenter no host). Descomente se precisar:
    # cap_add:
    #   - SYS_ADMIN
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "require('http').get('http://127.0.0.1:4020/login',r=>process.exit(r.statusCode>=200&&r.statusCode<500?0:1)).on('error',()=>process.exit(1));"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - coolify
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.downloader.rule=Host(`downloader.gvtserver.online`) || Host(`www.downloader.gvtserver.online`)'
      - traefik.http.routers.downloader.entrypoints=https
      - traefik.http.services.downloader.loadbalancer.server.port=4020
      - 'traefik.http.routers.downloader.middlewares=downloader-sec'
      - traefik.http.middlewares.downloader-sec.headers.forceSTSHeader=true
      - traefik.http.middlewares.downloader-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.downloader-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.downloader-sec.headers.stsPreload=true
      - traefik.http.middlewares.downloader-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.downloader-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.downloader-sec.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN
      - traefik.http.middlewares.downloader-sec.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-site
      - 'traefik.http.middlewares.downloader-sec.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(), geolocation=()'

volumes:
  downloader_node_modules: null

networks:
  coolify:
    external: true
